<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" class="trm-book-cover-svg trm-book-cover-fly">
  <style>
    .trm-book-cover-svg.trm-book-cover-fly {
      --fly-bg1: #ecfdf5;
      --fly-bg2: #d3fbe8;
      --fly-bg3: #b6f5d8;
      --fly-text: #063025;
      --fly-text-sub: rgba(6,48,37,0.72);
      --fly-text-meta: rgba(6,48,37,0.5);
      --fly-grid: rgba(0,0,0,0.05);
      --fly-spine: rgba(0,0,0,0.06);
      --fly-accent-from: #10b981;
      --fly-accent-to: #34d399;
      --fly-node-a: rgba(16,185,129,0.16);
      --fly-node-b: rgba(52,211,153,0.16);
      --fly-corner-a: #10b981;
      --fly-corner-b: #34d399;
    }
    :root.dark .trm-book-cover-svg.trm-book-cover-fly {
      --fly-bg1: #06251c;
      --fly-bg2: #0c3a2c;
      --fly-bg3: #104a37;
      --fly-text: #e9fdf4;
      --fly-text-sub: rgba(233,253,244,0.78);
      --fly-text-meta: rgba(233,253,244,0.55);
      --fly-grid: rgba(255,255,255,0.04);
      --fly-spine: rgba(255,255,255,0.08);
      --fly-accent-from: #34d399;
      --fly-accent-to: #6ee7b7;
      --fly-node-a: rgba(52,211,153,0.14);
      --fly-node-b: rgba(110,231,183,0.14);
      --fly-corner-a: #34d399;
      --fly-corner-b: #6ee7b7;
    }
  </style>
  <defs>
    <linearGradient id="bg-fly" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--fly-bg1)"/>
      <stop offset="50%" stop-color="var(--fly-bg2)"/>
      <stop offset="100%" stop-color="var(--fly-bg3)"/>
    </linearGradient>
    <linearGradient id="accent-fly" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--fly-accent-from)"/>
      <stop offset="100%" stop-color="var(--fly-accent-to)"/>
    </linearGradient>
    <pattern id="grid-fly" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--fly-grid)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="600" fill="url(#bg-fly)"/>
  <rect width="400" height="600" fill="url(#grid-fly)"/>

  <g transform="translate(200, 220)" fill="none" stroke="url(#accent-fly)" stroke-width="2" opacity="0.4">
    <circle cx="0" cy="-46" r="14" fill="var(--fly-node-a)"/>
    <circle cx="44" cy="14" r="12" fill="var(--fly-node-b)"/>
    <circle cx="-44" cy="14" r="12" fill="var(--fly-node-b)"/>
    <circle cx="0" cy="52" r="10" fill="var(--fly-node-a)"/>
    <line x1="0" y1="-46" x2="44" y2="14"/>
    <line x1="0" y1="-46" x2="-44" y2="14"/>
    <line x1="44" y1="14" x2="0" y2="52"/>
    <line x1="-44" y1="14" x2="0" y2="52"/>
    <line x1="44" y1="14" x2="-44" y2="14"/>
  </g>

  <rect x="0" y="0" width="14" height="600" fill="var(--fly-spine)"/>
  <rect x="40" y="60" width="320" height="4" fill="url(#accent-fly)" opacity="0.9"/>

<text x="200" y="356" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" letter-spacing="1" text-anchor="middle" fill="var(--__KEY__-text)" font-size="31">让代码飞</text>
<text x="200" y="400" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" letter-spacing="1" text-anchor="middle" fill="var(--__KEY__-text)" font-size="31">AI生成优化Python</text>

  <text x="200" y="456" text-anchor="middle" fill="var(--fly-text-sub)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" letter-spacing="2">全 7 章</text>
  <text x="200" y="540" text-anchor="middle" fill="var(--fly-text-meta)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2">心易 · 清华大学</text>

  <circle cx="360" cy="100" r="4" fill="var(--fly-corner-a)" opacity="0.6"/>
  <circle cx="360" cy="120" r="3" fill="var(--fly-corner-b)" opacity="0.6"/>
  <circle cx="360" cy="140" r="2" fill="var(--fly-corner-a)" opacity="0.4"/>
</svg>
