<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" class="trm-book-cover-svg trm-book-cover-vibe">
  <style>
    .trm-book-cover-svg.trm-book-cover-vibe {
      --vibe-bg1: #fff0f5;
      --vibe-bg2: #ffe0ec;
      --vibe-bg3: #ffd0e0;
      --vibe-text: #3a0a22;
      --vibe-text-sub: rgba(58,10,34,0.72);
      --vibe-text-meta: rgba(58,10,34,0.5);
      --vibe-grid: rgba(0,0,0,0.05);
      --vibe-spine: rgba(0,0,0,0.06);
      --vibe-accent-from: #ff4d8d;
      --vibe-accent-to: #ff80ab;
      --vibe-node-a: rgba(255,77,141,0.16);
      --vibe-node-b: rgba(255,128,171,0.16);
      --vibe-corner-a: #ff4d8d;
      --vibe-corner-b: #ff80ab;
    }
    :root.dark .trm-book-cover-svg.trm-book-cover-vibe {
      --vibe-bg1: #2a0a18;
      --vibe-bg2: #3a1024;
      --vibe-bg3: #4a1530;
      --vibe-text: #ffe9f1;
      --vibe-text-sub: rgba(255,233,241,0.78);
      --vibe-text-meta: rgba(255,233,241,0.55);
      --vibe-grid: rgba(255,255,255,0.04);
      --vibe-spine: rgba(255,255,255,0.08);
      --vibe-accent-from: #f472b6;
      --vibe-accent-to: #f9a8d4;
      --vibe-node-a: rgba(244,114,182,0.14);
      --vibe-node-b: rgba(249,168,212,0.14);
      --vibe-corner-a: #f472b6;
      --vibe-corner-b: #f9a8d4;
    }
  </style>
  <defs>
    <linearGradient id="bg-vibe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--vibe-bg1)"/>
      <stop offset="50%" stop-color="var(--vibe-bg2)"/>
      <stop offset="100%" stop-color="var(--vibe-bg3)"/>
    </linearGradient>
    <linearGradient id="accent-vibe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--vibe-accent-from)"/>
      <stop offset="100%" stop-color="var(--vibe-accent-to)"/>
    </linearGradient>
    <pattern id="grid-vibe" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--vibe-grid)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="600" fill="url(#bg-vibe)"/>
  <rect width="400" height="600" fill="url(#grid-vibe)"/>

  <g transform="translate(200, 220)" fill="none" stroke="url(#accent-vibe)" stroke-width="2" opacity="0.4">
    <circle cx="0" cy="-46" r="14" fill="var(--vibe-node-a)"/>
    <circle cx="44" cy="14" r="12" fill="var(--vibe-node-b)"/>
    <circle cx="-44" cy="14" r="12" fill="var(--vibe-node-b)"/>
    <circle cx="0" cy="52" r="10" fill="var(--vibe-node-a)"/>
    <line x1="0" y1="-46" x2="44" y2="14"/>
    <line x1="0" y1="-46" x2="-44" y2="14"/>
    <line x1="44" y1="14" x2="0" y2="52"/>
    <line x1="-44" y1="14" x2="0" y2="52"/>
    <line x1="44" y1="14" x2="-44" y2="14"/>
  </g>

  <rect x="0" y="0" width="14" height="600" fill="var(--vibe-spine)"/>
  <rect x="40" y="60" width="320" height="4" fill="url(#accent-vibe)" opacity="0.9"/>

<text x="200" y="356" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" letter-spacing="1" text-anchor="middle" fill="var(--__KEY__-text)" font-size="31">Vibe Coding</text>
<text x="200" y="400" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" letter-spacing="1" text-anchor="middle" fill="var(--__KEY__-text)" font-size="31">AI编程时代的认知重构</text>

  <text x="200" y="456" text-anchor="middle" fill="var(--vibe-text-sub)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" letter-spacing="2">全 14 章</text>
  <text x="200" y="540" text-anchor="middle" fill="var(--vibe-text-meta)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2">张昕东 · 异步社区</text>

  <circle cx="360" cy="100" r="4" fill="var(--vibe-corner-a)" opacity="0.6"/>
  <circle cx="360" cy="120" r="3" fill="var(--vibe-corner-b)" opacity="0.6"/>
  <circle cx="360" cy="140" r="2" fill="var(--vibe-corner-a)" opacity="0.4"/>
</svg>
