<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" class="trm-book-cover-svg trm-book-cover-agent">
  <style>
    .trm-book-cover-svg.trm-book-cover-agent {
      --agent-bg1: #f7f6f3;
      --agent-bg2: #eef2f7;
      --agent-bg3: #e4eaf1;
      --agent-text: #1a1a2e;
      --agent-text-sub: rgba(26, 26, 46, 0.72);
      --agent-text-meta: rgba(26, 26, 46, 0.5);
      --agent-grid: rgba(0, 0, 0, 0.05);
      --agent-spine: rgba(0, 0, 0, 0.06);
      --agent-accent-from: #7c4dff;
      --agent-accent-to: #00b8d4;
      --agent-node-a: rgba(124, 77, 255, 0.16);
      --agent-node-b: rgba(0, 184, 212, 0.16);
      --agent-corner-a: #00b8d4;
      --agent-corner-b: #7c4dff;
    }
    :root.dark .trm-book-cover-svg.trm-book-cover-agent {
      --agent-bg1: #1a1a2e;
      --agent-bg2: #16213e;
      --agent-bg3: #0f3460;
      --agent-text: #ffffff;
      --agent-text-sub: rgba(255, 255, 255, 0.75);
      --agent-text-meta: rgba(255, 255, 255, 0.55);
      --agent-grid: rgba(255, 255, 255, 0.04);
      --agent-spine: rgba(255, 255, 255, 0.08);
      --agent-accent-from: #7c4dff;
      --agent-accent-to: #00d4ff;
      --agent-node-a: rgba(124, 77, 255, 0.12);
      --agent-node-b: rgba(0, 212, 255, 0.12);
      --agent-corner-a: #00d4ff;
      --agent-corner-b: #7c4dff;
    }
  </style>
  <defs>
    <linearGradient id="bg-agent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--agent-bg1)"/>
      <stop offset="50%" stop-color="var(--agent-bg2)"/>
      <stop offset="100%" stop-color="var(--agent-bg3)"/>
    </linearGradient>
    <linearGradient id="accent-agent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--agent-accent-from)"/>
      <stop offset="100%" stop-color="var(--agent-accent-to)"/>
    </linearGradient>
    <pattern id="grid-agent" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--agent-grid)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bg-agent)"/>
  <rect width="400" height="600" fill="url(#grid-agent)"/>

  <!-- Abstract agent network -->
  <g transform="translate(200, 220)" fill="none" stroke="url(#accent-agent)" stroke-width="2" opacity="0.38">
    <circle cx="-60" cy="-30" r="12" fill="var(--agent-node-a)"/>
    <circle cx="60" cy="-30" r="12" fill="var(--agent-node-b)"/>
    <circle cx="0" cy="40" r="16" fill="var(--agent-node-a)"/>
    <circle cx="-50" cy="60" r="8" fill="var(--agent-node-b)"/>
    <circle cx="50" cy="60" r="8" fill="var(--agent-node-a)"/>
    <line x1="-60" y1="-30" x2="0" y2="40"/>
    <line x1="60" y1="-30" x2="0" y2="40"/>
    <line x1="0" y1="40" x2="-50" y2="60"/>
    <line x1="0" y1="40" x2="50" y2="60"/>
    <line x1="-60" y1="-30" x2="60" y2="-30"/>
  </g>

  <!-- Spine highlight -->
  <rect x="0" y="0" width="14" height="600" fill="var(--agent-spine)"/>

  <!-- Top accent bar -->
  <rect x="40" y="60" width="320" height="4" fill="url(#accent-agent)" opacity="0.9"/>

  <!-- Main title -->
  <text x="200" y="360" text-anchor="middle" fill="var(--agent-text)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700" letter-spacing="1">
    构建智能体
  </text>
  <text x="200" y="405" text-anchor="middle" fill="var(--agent-text)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700" letter-spacing="1">
    AI 系统
  </text>

  <!-- Subtitle -->
  <text x="200" y="460" text-anchor="middle" fill="var(--agent-text-sub)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" letter-spacing="3">
    读书笔记 · 16 章
  </text>

  <!-- Bottom meta -->
  <text x="200" y="540" text-anchor="middle" fill="var(--agent-text-meta)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" letter-spacing="2">
    HELLO-AGENTS
  </text>

  <!-- Corner ornaments -->
  <circle cx="360" cy="100" r="4" fill="var(--agent-corner-a)" opacity="0.6"/>
  <circle cx="360" cy="120" r="3" fill="var(--agent-corner-b)" opacity="0.6"/>
  <circle cx="360" cy="140" r="2" fill="var(--agent-corner-a)" opacity="0.4"/>
</svg>
