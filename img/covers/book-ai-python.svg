<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#1a3a34"/>
      <stop offset="100%" stop-color="#103c34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#1abc9c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect width="400" height="600" fill="url(#grid)"/>

  <!-- Abstract python nodes -->
  <g transform="translate(200, 220)" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.35">
    <circle cx="-60" cy="-30" r="12" fill="rgba(46,204,113,0.12)"/>
    <circle cx="60" cy="-30" r="12" fill="rgba(26,188,156,0.12)"/>
    <circle cx="0" cy="40" r="16" fill="rgba(46,204,113,0.15)"/>
    <circle cx="-50" cy="60" r="8" fill="rgba(26,188,156,0.1)"/>
    <circle cx="50" cy="60" r="8" fill="rgba(46,204,113,0.1)"/>
    <line x1="-60" y1="-30" x2="0" y2="40"/>
    <line x1="60" y1="-30" x2="0" y2="40"/>
    <line x1="0" y1="40" x2="-50" y2="60"/>
    <line x1="0" y1="40" x2="50" y2="60"/>
    <line x1="-60" y1="-30" x2="60" y2="-30"/>
  </g>

  <!-- Spine highlight -->
  <rect x="0" y="0" width="14" height="600" fill="rgba(255,255,255,0.08)"/>

  <!-- Top accent bar -->
  <rect x="40" y="60" width="320" height="4" fill="url(#accent)" opacity="0.9"/>

  <!-- Main title -->
  <text x="200" y="355" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700" letter-spacing="1">
    人工智能
  </text>
  <text x="200" y="397" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700" letter-spacing="1">
    极简编程入门
  </text>

  <!-- Subtitle -->
  <text x="200" y="452" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" letter-spacing="2">
    Python · 8 章
  </text>

  <!-- Bottom meta -->
  <text x="200" y="540" text-anchor="middle" fill="rgba(255,255,255,0.55)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" letter-spacing="2">
    时安 · 内容总览
  </text>

  <!-- Corner ornaments -->
  <circle cx="360" cy="100" r="4" fill="#1abc9c" opacity="0.6"/>
  <circle cx="360" cy="120" r="3" fill="#2ecc71" opacity="0.6"/>
  <circle cx="360" cy="140" r="2" fill="#1abc9c" opacity="0.4"/>
</svg>
