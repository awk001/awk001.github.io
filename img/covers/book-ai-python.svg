<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" class="trm-book-cover-svg trm-book-cover-python">
  <style>
    .trm-book-cover-svg.trm-book-cover-python {
      --python-bg1: #f4f7f5;
      --python-bg2: #eaf3ee;
      --python-bg3: #e2eee8;
      --python-text: #0f2027;
      --python-text-sub: rgba(15, 32, 39, 0.72);
      --python-text-meta: rgba(15, 32, 39, 0.5);
      --python-grid: rgba(0, 0, 0, 0.05);
      --python-spine: rgba(0, 0, 0, 0.06);
      --python-accent-from: #2ecc71;
      --python-accent-to: #1abc9c;
      --python-node-a: rgba(46, 204, 113, 0.18);
      --python-node-b: rgba(26, 188, 156, 0.18);
      --python-corner-a: #1abc9c;
      --python-corner-b: #2ecc71;
    }
    :root.dark .trm-book-cover-svg.trm-book-cover-python {
      --python-bg1: #0f2027;
      --python-bg2: #16302b;
      --python-bg3: #103c34;
      --python-text: #ffffff;
      --python-text-sub: rgba(255, 255, 255, 0.75);
      --python-text-meta: rgba(255, 255, 255, 0.55);
      --python-grid: rgba(255, 255, 255, 0.04);
      --python-spine: rgba(255, 255, 255, 0.08);
      --python-accent-from: #2ecc71;
      --python-accent-to: #1abc9c;
      --python-node-a: rgba(46, 204, 113, 0.12);
      --python-node-b: rgba(26, 188, 156, 0.12);
      --python-corner-a: #1abc9c;
      --python-corner-b: #2ecc71;
    }
  </style>
  <defs>
    <linearGradient id="bg-python" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--python-bg1)"/>
      <stop offset="50%" stop-color="var(--python-bg2)"/>
      <stop offset="100%" stop-color="var(--python-bg3)"/>
    </linearGradient>
    <linearGradient id="accent-python" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--python-accent-from)"/>
      <stop offset="100%" stop-color="var(--python-accent-to)"/>
    </linearGradient>
    <pattern id="grid-python" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--python-grid)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bg-python)"/>
  <rect width="400" height="600" fill="url(#grid-python)"/>

  <!-- Abstract python nodes -->
  <g transform="translate(200, 220)" fill="none" stroke="url(#accent-python)" stroke-width="2" opacity="0.38">
    <circle cx="-60" cy="-30" r="12" fill="var(--python-node-a)"/>
    <circle cx="60" cy="-30" r="12" fill="var(--python-node-b)"/>
    <circle cx="0" cy="40" r="16" fill="var(--python-node-a)"/>
    <circle cx="-50" cy="60" r="8" fill="var(--python-node-b)"/>
    <circle cx="50" cy="60" r="8" fill="var(--python-node-a)"/>
    <line x1="-60" y1="-30" x2="0" y2="40"/>
    <line x1="60" y1="-30" x2="0" y2="40"/>
    <line x1="0" y1="40" x2="-50" y2="60"/>
    <line x1="0" y1="40" x2="50" y2="60"/>
    <line x1="-60" y1="-30" x2="60" y2="-30"/>
  </g>

  <!-- Spine highlight -->
  <rect x="0" y="0" width="14" height="600" fill="var(--python-spine)"/>

  <!-- Top accent bar -->
  <rect x="40" y="60" width="320" height="4" fill="url(#accent-python)" opacity="0.9"/>

  <!-- Main title -->
  <text x="200" y="352" text-anchor="middle" fill="var(--python-text)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700" letter-spacing="1">
    人工智能
  </text>
  <text x="200" y="396" text-anchor="middle" fill="var(--python-text)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700" letter-spacing="1">
    极简编程入门
  </text>

  <!-- Subtitle -->
  <text x="200" y="452" text-anchor="middle" fill="var(--python-text-sub)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" letter-spacing="2">
    Python · 8 章
  </text>

  <!-- Bottom meta -->
  <text x="200" y="540" text-anchor="middle" fill="var(--python-text-meta)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" letter-spacing="2">
    时安 · 内容总览
  </text>

  <!-- Corner ornaments -->
  <circle cx="360" cy="100" r="4" fill="var(--python-corner-a)" opacity="0.6"/>
  <circle cx="360" cy="120" r="3" fill="var(--python-corner-b)" opacity="0.6"/>
  <circle cx="360" cy="140" r="2" fill="var(--python-corner-a)" opacity="0.4"/>
</svg>
