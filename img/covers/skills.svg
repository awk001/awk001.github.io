<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" class="trm-book-cover-svg trm-book-cover-skills">
  <style>
    .trm-book-cover-svg.trm-book-cover-skills {
      --skills-bg1: #eafbf0;
      --skills-bg2: #d4f6e2;
      --skills-bg3: #bef0d2;
      --skills-text: #063021;
      --skills-text-sub: rgba(6,48,33,0.72);
      --skills-text-meta: rgba(6,48,33,0.5);
      --skills-grid: rgba(0,0,0,0.05);
      --skills-spine: rgba(0,0,0,0.06);
      --skills-accent-from: #1bbf6f;
      --skills-accent-to: #4ade80;
      --skills-node-a: rgba(27,191,111,0.16);
      --skills-node-b: rgba(74,222,128,0.16);
      --skills-corner-a: #1bbf6f;
      --skills-corner-b: #4ade80;
    }
    :root.dark .trm-book-cover-svg.trm-book-cover-skills {
      --skills-bg1: #07211a;
      --skills-bg2: #0c3326;
      --skills-bg3: #103d2f;
      --skills-text: #e9fdf3;
      --skills-text-sub: rgba(233,253,243,0.78);
      --skills-text-meta: rgba(233,253,243,0.55);
      --skills-grid: rgba(255,255,255,0.04);
      --skills-spine: rgba(255,255,255,0.08);
      --skills-accent-from: #34d399;
      --skills-accent-to: #6ee7b7;
      --skills-node-a: rgba(52,211,153,0.14);
      --skills-node-b: rgba(110,231,183,0.14);
      --skills-corner-a: #34d399;
      --skills-corner-b: #6ee7b7;
    }
  </style>
  <defs>
    <linearGradient id="bg-skills" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--skills-bg1)"/>
      <stop offset="50%" stop-color="var(--skills-bg2)"/>
      <stop offset="100%" stop-color="var(--skills-bg3)"/>
    </linearGradient>
    <linearGradient id="accent-skills" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--skills-accent-from)"/>
      <stop offset="100%" stop-color="var(--skills-accent-to)"/>
    </linearGradient>
    <pattern id="grid-skills" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--skills-grid)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="600" fill="url(#bg-skills)"/>
  <rect width="400" height="600" fill="url(#grid-skills)"/>

  <g transform="translate(200, 220)" fill="none" stroke="url(#accent-skills)" stroke-width="2" opacity="0.4">
    <circle cx="0" cy="-46" r="14" fill="var(--skills-node-a)"/>
    <circle cx="44" cy="14" r="12" fill="var(--skills-node-b)"/>
    <circle cx="-44" cy="14" r="12" fill="var(--skills-node-b)"/>
    <circle cx="0" cy="52" r="10" fill="var(--skills-node-a)"/>
    <line x1="0" y1="-46" x2="44" y2="14"/>
    <line x1="0" y1="-46" x2="-44" y2="14"/>
    <line x1="44" y1="14" x2="0" y2="52"/>
    <line x1="-44" y1="14" x2="0" y2="52"/>
    <line x1="44" y1="14" x2="-44" y2="14"/>
  </g>

  <rect x="0" y="0" width="14" height="600" fill="var(--skills-spine)"/>
  <rect x="40" y="60" width="320" height="4" fill="url(#accent-skills)" opacity="0.9"/>

<text x="200" y="356" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" letter-spacing="1" text-anchor="middle" fill="var(--__KEY__-text)" font-size="31">Agent Skills</text>
<text x="200" y="400" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" letter-spacing="1" text-anchor="middle" fill="var(--__KEY__-text)" font-size="31">开发实战</text>

  <text x="200" y="456" text-anchor="middle" fill="var(--skills-text-sub)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" letter-spacing="2">全 9 章</text>
  <text x="200" y="540" text-anchor="middle" fill="var(--skills-text-meta)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2">ANDREW NG × ANTHROPIC</text>

  <circle cx="360" cy="100" r="4" fill="var(--skills-corner-a)" opacity="0.6"/>
  <circle cx="360" cy="120" r="3" fill="var(--skills-corner-b)" opacity="0.6"/>
  <circle cx="360" cy="140" r="2" fill="var(--skills-corner-a)" opacity="0.4"/>
</svg>
