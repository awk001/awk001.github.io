<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" class="trm-book-cover-svg trm-book-cover-adp">
  <style>
    .trm-book-cover-svg.trm-book-cover-adp {
      --adp-bg1: #f1eefe;
      --adp-bg2: #e3e0fd;
      --adp-bg3: #d2ccfb;
      --adp-text: #170d36;
      --adp-text-sub: rgba(23,13,54,0.72);
      --adp-text-meta: rgba(23,13,54,0.5);
      --adp-grid: rgba(0,0,0,0.05);
      --adp-spine: rgba(0,0,0,0.06);
      --adp-accent-from: #5b5bd6;
      --adp-accent-to: #8b5cf6;
      --adp-node-a: rgba(91,91,214,0.16);
      --adp-node-b: rgba(139,92,246,0.16);
      --adp-corner-a: #5b5bd6;
      --adp-corner-b: #8b5cf6;
    }
    :root.dark .trm-book-cover-svg.trm-book-cover-adp {
      --adp-bg1: #140d2e;
      --adp-bg2: #1c1440;
      --adp-bg3: #251a52;
      --adp-text: #f3effe;
      --adp-text-sub: rgba(243,239,254,0.78);
      --adp-text-meta: rgba(243,239,254,0.55);
      --adp-grid: rgba(255,255,255,0.04);
      --adp-spine: rgba(255,255,255,0.08);
      --adp-accent-from: #818cf8;
      --adp-accent-to: #a78bfa;
      --adp-node-a: rgba(129,140,248,0.14);
      --adp-node-b: rgba(167,139,250,0.14);
      --adp-corner-a: #818cf8;
      --adp-corner-b: #a78bfa;
    }
  </style>
  <defs>
    <linearGradient id="bg-adp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--adp-bg1)"/>
      <stop offset="50%" stop-color="var(--adp-bg2)"/>
      <stop offset="100%" stop-color="var(--adp-bg3)"/>
    </linearGradient>
    <linearGradient id="accent-adp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--adp-accent-from)"/>
      <stop offset="100%" stop-color="var(--adp-accent-to)"/>
    </linearGradient>
    <pattern id="grid-adp" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--adp-grid)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="600" fill="url(#bg-adp)"/>
  <rect width="400" height="600" fill="url(#grid-adp)"/>

  <g transform="translate(200, 220)" fill="none" stroke="url(#accent-adp)" stroke-width="2" opacity="0.4">
    <circle cx="0" cy="-46" r="14" fill="var(--adp-node-a)"/>
    <circle cx="44" cy="14" r="12" fill="var(--adp-node-b)"/>
    <circle cx="-44" cy="14" r="12" fill="var(--adp-node-b)"/>
    <circle cx="0" cy="52" r="10" fill="var(--adp-node-a)"/>
    <line x1="0" y1="-46" x2="44" y2="14"/>
    <line x1="0" y1="-46" x2="-44" y2="14"/>
    <line x1="44" y1="14" x2="0" y2="52"/>
    <line x1="-44" y1="14" x2="0" y2="52"/>
    <line x1="44" y1="14" x2="-44" y2="14"/>
  </g>

  <rect x="0" y="0" width="14" height="600" fill="var(--adp-spine)"/>
  <rect x="40" y="60" width="320" height="4" fill="url(#accent-adp)" opacity="0.9"/>

<text x="200" y="356" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" letter-spacing="1" text-anchor="middle" fill="var(--__KEY__-text)" font-size="31">Agent设计模式</text>
<text x="200" y="400" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" letter-spacing="1" text-anchor="middle" fill="var(--__KEY__-text)" font-size="31">可复用智能体架构</text>

  <text x="200" y="456" text-anchor="middle" fill="var(--adp-text-sub)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" letter-spacing="2">全 4 章</text>
  <text x="200" y="540" text-anchor="middle" fill="var(--adp-text-meta)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2">ANTONIO GULLI</text>

  <circle cx="360" cy="100" r="4" fill="var(--adp-corner-a)" opacity="0.6"/>
  <circle cx="360" cy="120" r="3" fill="var(--adp-corner-b)" opacity="0.6"/>
  <circle cx="360" cy="140" r="2" fill="var(--adp-corner-a)" opacity="0.4"/>
</svg>
