<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" class="trm-book-cover-svg trm-book-cover-pyai">
  <style>
    .trm-book-cover-svg.trm-book-cover-pyai {
      --pyai-bg1: #eef6ff;
      --pyai-bg2: #dceaff;
      --pyai-bg3: #c9dcff;
      --pyai-text: #0a1a3a;
      --pyai-text-sub: rgba(10,26,58,0.72);
      --pyai-text-meta: rgba(10,26,58,0.5);
      --pyai-grid: rgba(0,0,0,0.05);
      --pyai-spine: rgba(0,0,0,0.06);
      --pyai-accent-from: #3b82f6;
      --pyai-accent-to: #facc15;
      --pyai-node-a: rgba(59,130,246,0.16);
      --pyai-node-b: rgba(250,204,21,0.16);
      --pyai-corner-a: #3b82f6;
      --pyai-corner-b: #facc15;
    }
    :root.dark .trm-book-cover-svg.trm-book-cover-pyai {
      --pyai-bg1: #0a1a2e;
      --pyai-bg2: #10243f;
      --pyai-bg3: #16304f;
      --pyai-text: #eaf2ff;
      --pyai-text-sub: rgba(234,242,255,0.78);
      --pyai-text-meta: rgba(234,242,255,0.55);
      --pyai-grid: rgba(255,255,255,0.04);
      --pyai-spine: rgba(255,255,255,0.08);
      --pyai-accent-from: #60a5fa;
      --pyai-accent-to: #fde047;
      --pyai-node-a: rgba(96,165,250,0.14);
      --pyai-node-b: rgba(253,224,71,0.14);
      --pyai-corner-a: #60a5fa;
      --pyai-corner-b: #fde047;
    }
  </style>
  <defs>
    <linearGradient id="bg-pyai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--pyai-bg1)"/>
      <stop offset="50%" stop-color="var(--pyai-bg2)"/>
      <stop offset="100%" stop-color="var(--pyai-bg3)"/>
    </linearGradient>
    <linearGradient id="accent-pyai" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--pyai-accent-from)"/>
      <stop offset="100%" stop-color="var(--pyai-accent-to)"/>
    </linearGradient>
    <pattern id="grid-pyai" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--pyai-grid)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="600" fill="url(#bg-pyai)"/>
  <rect width="400" height="600" fill="url(#grid-pyai)"/>

  <g transform="translate(200, 220)" fill="none" stroke="url(#accent-pyai)" stroke-width="2" opacity="0.4">
    <circle cx="0" cy="-46" r="14" fill="var(--pyai-node-a)"/>
    <circle cx="44" cy="14" r="12" fill="var(--pyai-node-b)"/>
    <circle cx="-44" cy="14" r="12" fill="var(--pyai-node-b)"/>
    <circle cx="0" cy="52" r="10" fill="var(--pyai-node-a)"/>
    <line x1="0" y1="-46" x2="44" y2="14"/>
    <line x1="0" y1="-46" x2="-44" y2="14"/>
    <line x1="44" y1="14" x2="0" y2="52"/>
    <line x1="-44" y1="14" x2="0" y2="52"/>
    <line x1="44" y1="14" x2="-44" y2="14"/>
  </g>

  <rect x="0" y="0" width="14" height="600" fill="var(--pyai-spine)"/>
  <rect x="40" y="60" width="320" height="4" fill="url(#accent-pyai)" opacity="0.9"/>

<text x="200" y="356" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" letter-spacing="1" text-anchor="middle" fill="var(--__KEY__-text)" font-size="31">Python应用开发</text>
<text x="200" y="400" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" letter-spacing="1" text-anchor="middle" fill="var(--__KEY__-text)" font-size="31">AI辅助编程</text>

  <text x="200" y="456" text-anchor="middle" fill="var(--pyai-text-sub)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" letter-spacing="2">全 11 章</text>
  <text x="200" y="540" text-anchor="middle" fill="var(--pyai-text-meta)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2">郭躬德 · 王林</text>

  <circle cx="360" cy="100" r="4" fill="var(--pyai-corner-a)" opacity="0.6"/>
  <circle cx="360" cy="120" r="3" fill="var(--pyai-corner-b)" opacity="0.6"/>
  <circle cx="360" cy="140" r="2" fill="var(--pyai-corner-a)" opacity="0.4"/>
</svg>
