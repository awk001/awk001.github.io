<script>
(function () {
    var STORAGE_KEY = 'awk-links-custom';
    var HIDDEN_KEY = 'awk-links-hidden';
    var DEFAULT_LINKS = window.__LINKS_DEFAULT__ || [];
    var GH = window.__LINKS_GH__ || {};
    var API_OVERRIDE = (window.__LINKS_API__ || '').trim();
    var API = API_OVERRIDE || (GH.repo && GH.path
        ? ('https://raw.githubusercontent.com/' + GH.repo + '/' + (GH.branch || 'main') + '/' + GH.path)
        : '');

    var $status = document.getElementById('trm-links-status');
    var $tabs = document.getElementById('trm-links-tabs');
    var $groups = document.getElementById('trm-links-groups');
    var $modal = document.getElementById('trm-links-modal');
    var $modalTitle = document.getElementById('trm-links-modal-title');
    var $inputName = document.getElementById('trm-links-input-name');
    var $inputUrl = document.getElementById('trm-links-input-url');
    var $inputCategory = document.getElementById('trm-links-input-category');
    var $inputNewCategory = document.getElementById('trm-links-input-new-category');
    var $newCategoryWrap = document.getElementById('trm-links-new-category-wrap');
    var $inputDesc = document.getElementById('trm-links-input-desc');
    var $btnCancel = document.getElementById('trm-links-modal-cancel');
    var $btnSave = document.getElementById('trm-links-modal-save');
    var $contextMenu = document.getElementById('trm-links-context-menu');

    var baseLinks = [];

    // ---------- 本地存储（访客个性化） ----------
    function getCustomItems() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (e) { return []; }
    }
    function saveCustomItems(items) { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }
    function getHiddenItems() {
        try { return JSON.parse(localStorage.getItem(HIDDEN_KEY) || '[]'); } catch (e) { return []; }
    }
    function saveHiddenItems(items) { localStorage.setItem(HIDDEN_KEY, JSON.stringify(items)); }

    // ---------- 服务端读取（只读） ----------
    function apiGet() {
        if (!API) return Promise.resolve(null);
        return fetch(API, { headers: { 'Accept': 'application/json' } })
            .then(function (r) {
                if (!r.ok) return null;
                return r.json().then(function (data) {
                    if (data && Array.isArray(data.links)) return { initialized: true, links: data.links };
                    if (Array.isArray(data)) return { initialized: true, links: data };
                    return { initialized: true, links: [] };
                }).catch(function () { return null; });
            })
            .catch(function () { return null; });
    }

    // ---------- 安全链接 ----------
    function safeUrl(url) {
        var u = (url || '').toString().trim();
        if (!u) return '';
        var lower = u.toLowerCase();
        if (/^(https?:|mailto:|tel:|#|\/)/.test(lower)) return u;
        if (/^[a-z][a-z0-9+.\-]*:/i.test(lower)) return '';
        return u;
    }
    function escapeHtml(text) {
        return (text || '').toString()
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    // ---------- 生效数据：base + 访客自定义 - 隐藏名单 ----------
    function getEffectiveLinks() {
        var hidden = getHiddenItems();
        var result = (baseLinks || []).map(function (g) {
            return {
                category: g.category,
                items: (g.items || []).filter(function (it) {
                    return !hidden.some(function (h) { return h.name === it.name && h.category === g.category; });
                })
            };
        }).filter(function (g) { return g.items.length > 0; });
        getCustomItems().forEach(function (it) {
            if (!it || !it.name) return;
            var g = result.find(function (x) { return x.category === it.category; });
            if (!g) { g = { category: it.category, items: [] }; result.push(g); }
            var copy = { name: it.name, url: it.url, desc: it.desc, image: it.image };
            copy.__custom = true;
            g.items.push(copy);
        });
        return result;
    }

    // ---------- 渲染 ----------
    function renderAll() {
        var links = getEffectiveLinks();
        renderTabs(links);
        renderGroups(links);
        bindCards();
        var first = $tabs.querySelector('.trm-links-tab:not([data-target="all"])');
        activateTab(first ? first.getAttribute('data-target') : 'all');
    }

    function renderTabs(links) {
        $tabs.innerHTML = '';
        var all = document.createElement('button');
        all.type = 'button'; all.className = 'trm-links-tab'; all.setAttribute('data-target', 'all');
        all.textContent = '全部'; all.addEventListener('click', onTabClick);
        $tabs.appendChild(all);
        links.forEach(function (g, gi) {
            var t = document.createElement('button');
            t.type = 'button'; t.className = 'trm-links-tab';
            t.setAttribute('data-target', 'g' + gi); t.setAttribute('data-category', g.category);
            t.textContent = g.category; t.addEventListener('click', onTabClick);
            $tabs.appendChild(t);
        });
    }

    function renderGroups(links) {
        $groups.innerHTML = '';
        links.forEach(function (g, gi) {
            var group = document.createElement('div');
            group.className = 'trm-link-group';
            group.setAttribute('data-group', 'g' + gi);
            group.setAttribute('data-category', g.category);
            var row = document.createElement('div');
            row.className = 'row trm-links-group-row';
            group.appendChild(row);
            (g.items || []).forEach(function (item) {
                var wrap = document.createElement('div');
                wrap.innerHTML = createCardHtml(item, g.category, !!item.__custom);
                while (wrap.firstChild) row.appendChild(wrap.firstChild);
            });
            $groups.appendChild(group);
        });
    }

    function createCardHtml(item, category, isCustom) {
        var safe = safeUrl(item.url);
        var hasUrl = !!safe;
        var tag = hasUrl ? 'a' : 'div';
        var href = hasUrl ? ' href="' + safe.replace(/"/g, '&quot;') + '" target="_blank" rel="nofollow"' : '';
        var disabledClass = hasUrl ? '' : ' trm-link-card-disabled';
        var titleAttr = hasUrl ? '' : ' title="链接地址待补充"';
        var iconHtml = item.image
            ? '<img draggable="false" src="' + escapeHtml(item.image) + '" onerror="this.style.display=\'none\'" alt="' + escapeHtml(item.name) + '">'
            : '<span class="trm-link-card-letter">' + escapeHtml((item.name || '').trim().charAt(0)) + '</span>';
        var descHtml = item.desc ? '<div class="trm-link-card-desc">' + escapeHtml(item.desc).slice(0, 24) + '</div>' : '';
        var closeTag = hasUrl ? '</a>' : '</div>';
        return '<div class="col-lg-3 col-md-4 col-sm-6">' +
            '<' + tag + href + titleAttr + ' class="trm-link-card' + (isCustom ? ' trm-link-card-custom' : '') + ' trm-scroll-animation trm-active-el' + disabledClass + '"' +
            ' data-name="' + escapeHtml(item.name) + '" data-url="' + escapeHtml(safe) + '"' +
            ' data-desc="' + escapeHtml(item.desc || '') + '" data-category="' + escapeHtml(category) + '"' +
            ' data-custom="' + (isCustom ? 'true' : 'false') + '">' +
            '<div class="trm-link-card-icon">' + iconHtml + '</div>' +
            '<h6 class="trm-link-card-name">' + escapeHtml(item.name) + '</h6>' +
            descHtml +
            closeTag +
            '</div>';
    }

    function activateTab(target) {
        var tabs = $tabs.querySelectorAll('.trm-links-tab');
        var groups = $groups.querySelectorAll('.trm-link-group');
        tabs.forEach(function (t) { t.classList.toggle('active', t.getAttribute('data-target') === target); });
        groups.forEach(function (g) {
            var show = (target === 'all') || (g.getAttribute('data-group') === target);
            g.style.display = show ? '' : 'none';
        });
    }
    function onTabClick(e) { activateTab(e.currentTarget.getAttribute('data-target')); }

    // ---------- 弹窗（仅编辑） ----------
    function fillCategoryOptions(selected) {
        $inputCategory.innerHTML = '';
        var cats = getEffectiveLinks().map(function (g) { return g.category; })
            .filter(function (c, i, a) { return a.indexOf(c) === i; });
        cats.forEach(function (c) {
            var o = document.createElement('option');
            o.value = c; o.textContent = c;
            if (c === selected) o.selected = true;
            $inputCategory.appendChild(o);
        });
        var neu = document.createElement('option');
        neu.value = '__new__'; neu.textContent = '+ 新建分类';
        $inputCategory.appendChild(neu);
    }

    function openModal(data) {
        $modal.classList.add('active');
        $modalTitle.textContent = '编辑链接';
        $inputName.value = data.name || '';
        $inputUrl.value = data.url || '';
        $inputDesc.value = data.desc || '';
        $inputCategory.value = data.category || '';
        fillCategoryOptions(data.category);
        if (!$inputCategory.value) {
            $inputCategory.value = '__new__';
            $newCategoryWrap.style.display = 'block';
            $inputNewCategory.value = data.category || '';
        }
        $modal.dataset.editName = data.name;
        $modal.dataset.editCategory = data.category;
        $modal.dataset.editCustom = data.custom ? 'true' : 'false';
    }
    function closeModal() { $modal.classList.remove('active'); }

    function saveLink() {
        var name = $inputName.value.trim();
        var url = $inputUrl.value.trim();
        var desc = $inputDesc.value.trim();
        var category = $inputCategory.value;
        if (category === '__new__') category = $inputNewCategory.value.trim();
        if (!name) { alert('请输入名称'); return; }
        if (!category) { alert('请选择或输入分类'); return; }
        if (url && /^(javascript|data|vbscript):/i.test(url)) {
            alert('链接地址使用了不支持的协议，请填写 http(s) 等安全链接');
            return;
        }

        var items = getCustomItems();
        var oldName = $modal.dataset.editName;
        var oldCategory = $modal.dataset.editCategory;
        var editingCustom = $modal.dataset.editCustom === 'true';
        if (editingCustom) {
            var idx = items.findIndex(function (it) { return it.name === oldName && it.category === oldCategory; });
            if (idx > -1) items[idx] = { name: name, url: url, desc: desc, category: category };
        } else {
            var hidden = getHiddenItems();
            if (!hidden.some(function (it) { return it.name === oldName && it.category === oldCategory; })) {
                hidden.push({ name: oldName, category: oldCategory });
                saveHiddenItems(hidden);
            }
            items.push({ name: name, url: url, desc: desc, category: category });
        }
        saveCustomItems(items);
        closeModal();
        window.location.reload();
    }

    function deleteLink(name, category, isCustom) {
        if (!confirm('确定删除「' + name + '」吗？')) return;
        if (isCustom) {
            var items = getCustomItems().filter(function (it) { return !(it.name === name && it.category === category); });
            saveCustomItems(items);
        } else {
            var hidden = getHiddenItems();
            if (!hidden.some(function (it) { return it.name === name && it.category === category; })) {
                hidden.push({ name: name, category: category });
                saveHiddenItems(hidden);
            }
        }
        window.location.reload();
    }

    // ---------- 右键 / 长按 ----------
    function showContextMenu(e, card) {
        e.preventDefault(); e.stopPropagation();
        $contextMenu.style.display = 'block';
        var menuWidth = $contextMenu.offsetWidth || 100;
        var menuHeight = $contextMenu.offsetHeight || 76;
        var x = e.clientX + 8, y = e.clientY + 8;
        if (x + menuWidth > window.innerWidth) x = e.clientX - menuWidth - 8;
        if (y + menuHeight > window.innerHeight) y = e.clientY - menuHeight - 8;
        $contextMenu.style.left = x + 'px';
        $contextMenu.style.top = y + 'px';
        $contextMenu.dataset.name = card.dataset.name;
        $contextMenu.dataset.url = card.dataset.url;
        $contextMenu.dataset.desc = card.dataset.desc;
        $contextMenu.dataset.category = card.dataset.category;
        $contextMenu.dataset.custom = card.dataset.custom || 'false';
    }
    function hideContextMenu() { $contextMenu.style.display = 'none'; }
    function initLongPress(card) {
        var timer = null;
        function start(e) {
            if (e.type === 'touchstart' && e.touches.length > 1) return;
            timer = setTimeout(function () { showContextMenu(e, card); }, 600);
        }
        function cancel() { if (timer) { clearTimeout(timer); timer = null; } }
        card.addEventListener('touchstart', start, { passive: true });
        card.addEventListener('touchend', cancel);
        card.addEventListener('touchmove', cancel);
        card.addEventListener('contextmenu', function (e) { e.preventDefault(); showContextMenu(e, card); });
    }
    function bindCards() {
        document.querySelectorAll('.trm-link-card').forEach(function (card) { initLongPress(card); });
    }

    // ---------- 初始化 ----------
    function setStatus(text) { if ($status) $status.textContent = text; }
    function init() {
        apiGet().then(function (d) {
            if (d && d.initialized) {
                baseLinks = d.links || [];
            } else {
                baseLinks = DEFAULT_LINKS;
            }
            if (!API) setStatus('本地默认数据');
            else if (!(d && d.initialized)) setStatus('远程数据未加载，使用本地默认数据');
            else setStatus('远程数据已加载');
            renderAll();
        }).catch(function () { renderAll(); });

        $btnCancel.addEventListener('click', closeModal);
        $btnSave.addEventListener('click', saveLink);
        $inputCategory.addEventListener('change', function () {
            $newCategoryWrap.style.display = ($inputCategory.value === '__new__') ? 'block' : 'none';
        });
        $modal.addEventListener('click', function (e) { if (e.target === $modal) closeModal(); });
        document.addEventListener('click', function (e) { if (!$contextMenu.contains(e.target)) hideContextMenu(); });
        $contextMenu.addEventListener('click', function (e) {
            var action = e.target.getAttribute('data-action');
            var name = $contextMenu.dataset.name;
            var url = $contextMenu.dataset.url;
            var desc = $contextMenu.dataset.desc;
            var category = $contextMenu.dataset.category;
            var isCustom = ($contextMenu.dataset.custom || 'false') === 'true';
            hideContextMenu();
            if (action === 'edit') openModal({ name: name, url: url, desc: desc, category: category, custom: isCustom });
            else if (action === 'delete') deleteLink(name, category, isCustom);
        });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
})();
</script>
